---
- name: Validate Fail2Ban package settings
  ansible.builtin.assert:
    that:
      - fail2ban_package_name is string
      - fail2ban_package_name | length > 0
      - fail2ban_package_state in ['present', 'latest']
      - fail2ban_epel_package_name is string
      - fail2ban_epel_package_name | length > 0
      - (fail2ban_apt_cache_valid_time | string) is match('^[0-9]+$')
      - fail2ban_config_dir is string
      - fail2ban_config_dir | length > 0
      - fail2ban_filter_dir is string
      - fail2ban_filter_dir | length > 0
      - fail2ban_action_dir is string
      - fail2ban_action_dir | length > 0
      - fail2ban_jail_local_path is string
      - fail2ban_jail_local_path | length > 0
      - fail2ban_ignoreip is sequence
      - fail2ban_jails is mapping or (fail2ban_jails is sequence and fail2ban_jails is not string)
      - fail2ban_custom_filters is sequence
      - fail2ban_custom_actions is sequence
      - fail2ban_service_name is string
      - fail2ban_service_name | length > 0
      - fail2ban_service_state in ['started', 'stopped', 'restarted', 'reloaded']
      - fail2ban_client_command is string
      - fail2ban_client_command | length > 0
    quiet: true
    fail_msg: >-
      Set Fail2Ban package, configuration, service, and verification settings
      to valid values. Package state must be present or latest, apt cache
      validity must be a non-negative integer, jails must be a mapping or list,
      and custom filter/action definitions must be lists.

- name: Validate list-style Fail2Ban jail definitions
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.config is defined
      - item.config is mapping
    quiet: true
    fail_msg: >-
      List-style Fail2Ban jail definitions must be mappings with a non-empty
      name and a config mapping.
  loop: >-
    {{
      fail2ban_jails
      if fail2ban_jails is sequence
      and fail2ban_jails is not string
      and fail2ban_jails is not mapping
      else []
    }}
