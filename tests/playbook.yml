---
- name: Provision local Fail2Ban test containers
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Install test containers when inventory requests them
      ansible.builtin.include_tasks: tasks/provision_containers.yml
      when: groups.get('fail2ban_test_hosts', []) | length > 0

- name: Validate Fail2Ban role on Linux targets
  hosts: fail2ban_test_hosts
  vars:
    fail2ban_pkg_install_latest: "false"
    fail2ban_mapping_jails:
      sshd:
        enabled: false
        filter: sshd
        logpath: /var/log/secure
        maxretry: 6
        port: ssh
    fail2ban_list_jails:
      - name: sshd
        config:
          enabled: false
          filter: sshd
          logpath: /var/log/secure
          maxretry: 6
          port: ssh
      - name: ssh-rich
        config:
          enabled: false
          filter:
            name: sshd
          actions:
            - action:
                name: iptables-multiport
              args:
                name: ssh-rich
                port: ssh
                protocol: tcp
          logpath: /var/log/auth.log
          maxretry: 3
          port: ssh
  tasks:
    - name: Run Fail2Ban role with mapping-style jails
      ansible.builtin.include_role:
        name: ansible-fail2ban
        public: true
      vars:
        fail2ban_jails: "{{ fail2ban_mapping_jails }}"

    - name: Assert compatibility switch keeps present package state
      ansible.builtin.assert:
        that:
          - fail2ban_package_state == 'present'
        quiet: true

    - name: Run mapping-style Fail2Ban behavior validation tasks
      ansible.builtin.include_tasks: tasks/test_tasks.yml
      vars:
        fail2ban_test_expected_jail_lines:
          - "[sshd]"
          - "enabled = false"
          - "filter = sshd"

    - name: Run Fail2Ban role with list-style jails
      ansible.builtin.include_role:
        name: ansible-fail2ban
        public: true
      vars:
        fail2ban_jails: "{{ fail2ban_list_jails }}"

    - name: Run list-style Fail2Ban behavior validation tasks
      ansible.builtin.include_tasks: tasks/test_tasks.yml
      vars:
        fail2ban_test_expected_jail_lines:
          - "[ssh-rich]"
          - "enabled = false"
          - "filter = sshd"
          - "action = iptables-multiport [name=ssh-rich,port=ssh,protocol=tcp]"
